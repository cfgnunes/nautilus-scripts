name: CI

on:
  push:
  pull_request:


permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run 'install.sh'
      run: bash <(wget -qO- https://cfgnunes.github.io/nautilus-scripts/install.sh) -n

    - name: Run 'tests-shellcheck.sh'
      run: bash .helpers/tests-shellcheck.sh

    - name: Run 'tests-functions.sh'
      run: bash .helpers/tests-functions.sh

    - name: Run 'tests-scripts.sh'
      run: bash .helpers/tests-scripts.sh
