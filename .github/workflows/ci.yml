name: CI

on:
  push:
  pull_request:


permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run installer
      run: bash <(wget -qO- https://cfgnunes.github.io/nautilus-scripts/install.sh) -n

    - name: Run shellcheck
      run: bash .helpers/tests-shellcheck.sh

    - name: Run function tests
      run: bash .helpers/unit-tests-functions.sh

    - name: Run scripts tests
      run: bash .helpers/unit-tests-scripts.sh
